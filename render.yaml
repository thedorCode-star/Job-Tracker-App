services:
  - type: web
    name: job-tracker-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString

databases:
  - name: job-tracker-db
    plan: free
    region: oregon
    databaseName: job_tracker
    user: job_user
