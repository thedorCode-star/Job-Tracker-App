name: CI

on:
  push:
    branches: [main, qa-testing]
  pull_request:
    branches: [main, qa-testing]

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: job_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: job_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      PORT: 5000
      DB_USER: job_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_NAME: job_tracker
      DB_PORT: 5432
      JWT_SECRET: ci-test-jwt-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load database schema
        run: PGPASSWORD=$DB_PASSWORD psql -h localhost -U $DB_USER -d $DB_NAME -f init.sql

      - name: Run Playwright API tests
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
