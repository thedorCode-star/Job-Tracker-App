name: CI

on:
  push:
    branches: [main, qa-testing]
  pull_request:
    branches: [main, qa-testing]

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: job_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: job_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      PORT: 5000
      DB_USER: job_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_NAME: job_tracker
      DB_PORT: 5432
      JWT_SECRET: ci-test-jwt-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load database schema
        run: PGPASSWORD=$DB_PASSWORD psql -h localhost -U $DB_USER -d $DB_NAME -f init.sql

      - name: Run Playwright API tests
        run: npm test

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## API Test Results"
            echo ""
            if [ -f test-results/junit.xml ]; then
              TESTS=$(grep -o 'tests="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*')
              FAILURES=$(grep -o 'failures="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*')
              ERRORS=$(grep -o 'errors="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*')
              PASSED=$((TESTS - FAILURES - ERRORS))
              echo "| Metric | Count |"
              echo "|--------|-------|"
              echo "| Total | ${TESTS:-0} |"
              echo "| Passed | ${PASSED:-0} |"
              echo "| Failed | ${FAILURES:-0} |"
              echo ""
              if [ "${FAILURES:-0}" = "0" ] && [ "${ERRORS:-0}" = "0" ]; then
                echo "All tests passed."
              fi
            else
              echo "JUnit report not found. Check workflow logs."
            fi
            echo ""
            echo "Download the **playwright-report** artifact from this workflow run for the full HTML report."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 30

      - name: Publish JUnit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright API Tests
          path: test-results/junit.xml
          reporter: java-junit

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
